[package]
name = "csqtt-ipc"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "csqtt-win service <-> CLI/tray protocol over a named pipe (JSON lines)"

[dependencies]
anyhow = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["full"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_Memory"] }
