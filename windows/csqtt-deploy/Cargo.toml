[package]
name = "csqtt-deploy"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Server deploy/update/remove over SSH and client update checks (port of DeployOperations.kt / AppUpdate.kt)"

[dependencies]
csqtt-logic = { path = "../csqtt-logic" }
anyhow = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["full"] }
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
ureq = { version = "3", features = ["json"] }
