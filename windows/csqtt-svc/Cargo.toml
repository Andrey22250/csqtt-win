[package]
name = "csqtt-svc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "csqtt-win host service: Wintun adapter, routes, DNS, core process (port of TunnelManager/TunVpnService)"

[dependencies]
csqtt-logic = { path = "../csqtt-logic" }
csqtt-ipc = { path = "../csqtt-ipc" }
anyhow = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
base64 = "0.22"
ureq = { version = "3.5.1", features = ["json"] }

[target.'cfg(windows)'.dependencies]
wintun = "0.5.1"
windows-service = "0.8"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
] }
