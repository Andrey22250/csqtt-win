[package]
name = "csqtt-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "csqtt: CLI and tray for csqtt-win (talks to csqtt-svc over IPC, no UAC)"

[[bin]]
name = "csqtt"
path = "src/main.rs"

[dependencies]
csqtt-ipc = { path = "../csqtt-ipc" }
anyhow = "1"
serde_json = "1.0.151"
tokio = { version = "1", features = ["full"] }
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell", "Win32_System_Console", "Win32_System_Registry"] }
csqtt-logic = { version = "0.1.0", path = "../csqtt-logic" }
csqtt-deploy = { version = "0.1.0", path = "../csqtt-deploy" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Security_Cryptography"] }
